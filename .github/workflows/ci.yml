        run: uv run --project tools python -m desk_tools.gate --name tier1 --run-if evals/run.py --required-if backend/desk/kernel_service/app.py -- make evals-tier1
      - name: Run the kernel contract tests against the real kernel
        env:
          PYTEST_ADDOPTS: --shard=3/4
        run: uv run --project tools python -m desk_tools.gate --name kernel-contract --run-if backend/tests/kernel_contract/conftest.py --required-if backend/desk/api/kernel_client.py -- make kernel-contract

  tier1-4:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    name: tier 1 evals 4/4
    runs-on: ${{ vars.CI_RUNNER_MODE == 'ec2' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","desk-ci-{0}-{1}-{2}-tier1-4"]', 'ondemand', github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 40
    services:
      postgres:
        # Docker Hub on GitHub-hosted runners, whose shared addresses run into ECR Public's anonymous
        # pull limit; the same official image from its ECR Public mirror on self-hosted runners.
        image: ${{ vars.CI_RUNNER_MODE == 'ec2' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'public.ecr.aws/docker/library/postgres:16' || 'postgres:16' }}
        ports: ["5433:5432"]
        env:
          POSTGRES_USER: desk_admin
          POSTGRES_PASSWORD: change-me-admin
          POSTGRES_DB: desk
        options: >-
          --health-cmd "pg_isready -U desk_admin"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-desk
      # make db-roles uses psql. GitHub-hosted runners have it; elsewhere it comes from apt.
      - name: Install the Postgres client if the runner has none
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get -o DPkg::Lock::Timeout=300 update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install -y -q --no-install-recommends postgresql-client
          fi
      - name: Use the local settings
        run: |
          cp .env.example .env
          grep -E '^[A-Z][A-Z0-9_]*=' .env >> "$GITHUB_ENV"
      - name: Check the migrations have one head
        run: test "$(cd backend && uv run alembic heads | wc -l)" -eq 1
      - name: Migrate
        run: cd backend && uv run alembic upgrade head
      - name: Set the role passwords
        run: make db-roles
      - name: Make the job's database skip durable commits
        run: make db-throwaway
      - name: Run the tier 1 evals
        env:
          PYTEST_ADDOPTS: --shard=4/4
        run: uv run --project tools python -m desk_tools.gate --name tier1 --run-if evals/run.py --required-if backend/desk/kernel_service/app.py -- make evals-tier1
      - name: Run the kernel contract tests against the real kernel
        env:
          PYTEST_ADDOPTS: --shard=4/4
        run: uv run --project tools python -m desk_tools.gate --name kernel-contract --run-if backend/tests/kernel_contract/conftest.py --required-if backend/desk/api/kernel_client.py -- make kernel-contract

  tier2:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    name: tier 2 results
    runs-on: ${{ vars.CI_RUNNER_MODE == 'ec2' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","desk-ci-{0}-{1}-{2}-tier2"]', 'ondemand', github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-desk
        with:
          build: false
      - name: Check the tier 2 results
        env:
          RESULTS_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          FORCED: ${{ github.event_name == 'push' && github.event.forced || false }}
        run: |
          if [ "$FORCED" = "true" ]; then
            echo "::error::a force-push to main replaced history that CI can't check for rewritten rates or waivers"
            exit 1
          fi
          HISTORY_SINCE=""
          if [ -z "$RESULTS_BASE" ]; then
            RESULTS_BASE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            HISTORY_SINCE="$RESULTS_BASE"
          fi
          uv run --project tools python -m desk_tools.gate --name tier2-results --run-if evals/results.py --required-if evals/results -- make evals-results-check BASE="$RESULTS_BASE" HISTORY_SINCE="$HISTORY_SINCE"

  web:
    name: web tests
    runs-on: ${{ vars.CI_RUNNER_MODE == 'ec2' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","desk-ci-{0}-{1}-{2}-web"]', 'ondemand', github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    needs: [changes, web-1, web-2, web-3, web-4, web-e2e]
    if: always()
    steps:
      - name: Require every shard and the end-to-end test to pass
        env:
          NEEDED: ${{ needs.changes.outputs.web }}
          SHARD_1: ${{ needs.web-1.result }}
          SHARD_2: ${{ needs.web-2.result }}
          SHARD_3: ${{ needs.web-3.result }}
          SHARD_4: ${{ needs.web-4.result }}
          E2E: ${{ needs.web-e2e.result }}
        run: |
          if [ "$NEEDED" = false ] && test "$SHARD_1" = skipped && test "$SHARD_2" = skipped && test "$SHARD_3" = skipped && test "$SHARD_4" = skipped && test "$E2E" = skipped; then
            exit 0
          fi
          test "$SHARD_1" = success && test "$SHARD_2" = success && test "$SHARD_3" = success && test "$SHARD_4" = success && test "$E2E" = success

  web-1:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    name: web tests 1/4
    runs-on: ${{ vars.CI_RUNNER_MODE == 'ec2' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","desk-ci-{0}-{1}-{2}-web-1"]', 'ondemand', github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: this job runs before web/package-lock.json exists.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          ignore-nothing-to-cache: true
      - name: Run the web type check and unit tests
        env:
          WEB_TEST_ARGS: --shard=1/4 --maxWorkers=2
        run: uv run --project tools python -m desk_tools.gate --name web --run-if web/package.json -- make web-test

  web-2:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    name: web tests 2/4
    runs-on: ${{ vars.CI_RUNNER_MODE == 'ec2' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","desk-ci-{0}-{1}-{2}-web-2"]', 'ondemand', github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: this job runs before web/package-lock.json exists.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          ignore-nothing-to-cache: true
      - name: Run the web type check and unit tests
        env:
          WEB_TEST_ARGS: --shard=2/4 --maxWorkers=2
        run: uv run --project tools python -m desk_tools.gate --name web --run-if web/package.json -- make web-test

  web-3:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    name: web tests 3/4
    runs-on: ${{ vars.CI_RUNNER_MODE == 'ec2' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","desk-ci-{0}-{1}-{2}-web-3"]', 'ondemand', github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: this job runs before web/package-lock.json exists.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          ignore-nothing-to-cache: true
      - name: Run the web type check and unit tests
        env:
          WEB_TEST_ARGS: --shard=3/4 --maxWorkers=2
        run: uv run --project tools python -m desk_tools.gate --name web --run-if web/package.json -- make web-test

  web-4:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    name: web tests 4/4
    runs-on: ${{ vars.CI_RUNNER_MODE == 'ec2' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","desk-ci-{0}-{1}-{2}-web-4"]', 'ondemand', github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: this job runs before web/package-lock.json exists.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          ignore-nothing-to-cache: true
      - name: Run the web type check and unit tests
        env:
          WEB_TEST_ARGS: --shard=4/4 --maxWorkers=2
        run: uv run --project tools python -m desk_tools.gate --name web --run-if web/package.json -- make web-test

  web-e2e:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    name: web tests e2e
    runs-on: ${{ vars.CI_RUNNER_MODE == 'ec2' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","desk-ci-{0}-{1}-{2}-web-e2e"]', 'ondemand', github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: this job runs before web/package-lock.json exists.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          ignore-nothing-to-cache: true
      - name: Build the web app and run the mocked end-to-end test
        run: uv run --project tools python -m desk_tools.gate --name web-e2e --run-if web/playwright.config.ts --required-if web/e2e -- make web-deps web-e2e

  infra:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    name: infra synth
    runs-on: ${{ vars.CI_RUNNER_MODE == 'ec2' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","desk-ci-{0}-{1}-{2}-infra"]', 'ondemand', github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          ignore-nothing-to-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Test and synthesize the infrastructure
        # jsii refuses a package cache under a group-writable home, as on the single-use runners.
        env:
          JSII_RUNTIME_PACKAGE_CACHE: disabled
        run: uv run --project tools python -m desk_tools.gate --name infra --run-if infra/cdk.json -- make infra-check

  secret-scan:
    name: secret scan
    runs-on: ${{ vars.CI_RUNNER_MODE == 'ec2' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","desk-ci-{0}-{1}-{2}-secret-scan"]', 'ondemand', github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          case "$RUNNER_ARCH" in
            X64)
              archive=gitleaks_8.30.1_linux_x64.tar.gz
              sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
              ;;
            ARM64)
              archive=gitleaks_8.30.1_linux_arm64.tar.gz
              sha256=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
              ;;
            *)
              echo "gitleaks: no archive is pinned for runner architecture $RUNNER_ARCH" >&2
              exit 1
              ;;
          esac
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          cd "$dir"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "$sha256  $archive" | sha256sum -c --strict
          tar -xzf "$archive" gitleaks
          echo "$dir" >> "$GITHUB_PATH"
      - name: Scan the history for secrets
        run: gitleaks git --redact --verbose --no-banner --exit-code 1 --ignore-gitleaks-allow --log-opts="--full-history HEAD" .

  repo:
    name: repo checks
    runs-on: ${{ vars.CI_RUNNER_MODE == 'ec2' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","desk-ci-{0}-{1}-{2}-repo"]', 'ondemand', github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          ignore-nothing-to-cache: true
      - name: Install actionlint 1.7.12
        run: |
          case "$RUNNER_ARCH" in
            X64)
              archive=actionlint_1.7.12_linux_amd64.tar.gz
              sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              ;;
            ARM64)
              archive=actionlint_1.7.12_linux_arm64.tar.gz
              sha256=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
              ;;
            *)
              echo "actionlint: no archive is pinned for runner architecture $RUNNER_ARCH" >&2
              exit 1
              ;;
          esac
          dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$dir"
          cd "$dir"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          echo "$sha256  $archive" | sha256sum -c --strict
          tar -xzf "$archive" actionlint
          echo "$dir" >> "$GITHUB_PATH"
      # actionlint checks the workflow's scripts with shellcheck only when it is on PATH.
      # GitHub-hosted runners have it; elsewhere it comes from apt.
      - name: Install ShellCheck if the runner has none
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get -o DPkg::Lock::Timeout=300 update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install -y -q --no-install-recommends shellcheck
          fi
      - name: Lint the workflow
        run: actionlint
      - name: Run the repository tooling tests
        run: cd tools && uv run pytest -q
      - name: Check the docs
        run: uv run --project tools python -m desk_tools.gate --name docs --run-if tools/desk_tools/check_docs.py -- make docs-check
