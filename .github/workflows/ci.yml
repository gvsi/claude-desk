# The nine required checks on main and on pull requests to any base; docs/ci.md says what each proves.
# The changed paths job rules out unaffected suites on pull requests before they take a runner.
# Suites that other parts of the project add run through tools/desk_tools/gate.py, which runs,
# skips visibly or fails each one by whether its code is in the repo. No secrets, read-only.
# Jobs run on GitHub-hosted ubuntu-24.04 unless the repository variable CI_RUNNER_MODE is "ec2" and
# the run isn't a pull request from a fork (docs/ci.md, "Runners"); each job's runs-on ends in its
# own label suffix.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every uv command uses the committed lockfile, and fails if it is missing or out of date.
env:
  UV_LOCKED: "1"

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: changed paths
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_MODE == 'ec2' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","desk-ci-{0}-{1}-{2}-changes"]', 'ondemand', github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      web: ${{ steps.classify.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify the changed paths
        id: classify
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: PYTHONPATH=tools python3 -m desk_tools.changed_paths

  backend:
    name: backend tests
    runs-on: ${{ vars.CI_RUNNER_MODE == 'ec2' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","desk-ci-{0}-{1}-{2}-backend"]', 'ondemand', github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    needs: [changes, backend-1, backend-2, backend-3, backend-4]
    if: always()
    steps:
      - name: Require every shard to pass
        env:
          NEEDED: ${{ needs.changes.outputs.backend }}
          SHARD_1: ${{ needs.backend-1.result }}
          SHARD_2: ${{ needs.backend-2.result }}
          SHARD_3: ${{ needs.backend-3.result }}
          SHARD_4: ${{ needs.backend-4.result }}
        run: |
          if [ "$NEEDED" = false ] && test "$SHARD_1" = skipped && test "$SHARD_2" = skipped && test "$SHARD_3" = skipped && test "$SHARD_4" = skipped; then
            exit 0
          fi
          test "$SHARD_1" = success && test "$SHARD_2" = success && test "$SHARD_3" = success && test "$SHARD_4" = success

  backend-1:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    name: backend tests 1/4
    runs-on: ${{ vars.CI_RUNNER_MODE == 'ec2' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","desk-ci-{0}-{1}-{2}-backend-1"]', 'ondemand', github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 40
    services:
      postgres:
        # Docker Hub on GitHub-hosted runners, whose shared addresses run into ECR Public's anonymous
        # pull limit; the same official image from its ECR Public mirror on self-hosted runners.
        image: ${{ vars.CI_RUNNER_MODE == 'ec2' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'public.ecr.aws/docker/library/postgres:16' || 'postgres:16' }}
        ports: ["5433:5432"]
        env:
          POSTGRES_USER: desk_admin
          POSTGRES_PASSWORD: change-me-admin
          POSTGRES_DB: desk
        options: >-
          --health-cmd "pg_isready -U desk_admin"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-desk
      # make db-roles uses psql. GitHub-hosted runners have it; elsewhere it comes from apt.
      - name: Install the Postgres client if the runner has none
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get -o DPkg::Lock::Timeout=300 update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install -y -q --no-install-recommends postgresql-client
          fi
      - name: Use the local settings
        run: |
          cp .env.example .env
          grep -E '^[A-Z][A-Z0-9_]*=' .env >> "$GITHUB_ENV"
      - name: Check the migrations have one head
        run: test "$(cd backend && uv run alembic heads | wc -l)" -eq 1
      - name: Migrate
        run: cd backend && uv run alembic upgrade head
      - name: Set the role passwords
        run: make db-roles
      - name: Make the job's database skip durable commits
        run: make db-throwaway
      - name: Run the backend tests
        env:
          PYTEST_ADDOPTS: --shard=1/4
        run: cd backend && uv run pytest -q

