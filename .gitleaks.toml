# Settings for CI's `secret scan` check: gitleaks' default rules, with one reviewed allowlist entry below.
#
# tools/tests/test_ci_workflow.py requires this file to hold only these settings and no
# .gitleaksignore to exist, and the scan ignores inline gitleaks:allow comments. An exception is a
# reviewed change to that test and this file: one entry naming one file and why it holds no secret.
#
#   [[allowlists]]
#   description = "<file>: <why it holds no secret>"
#   paths = ['''^<file>$''']

minVersion = "v8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "backend/tests/kernel/fixtures/kernel_core_version.json: a kernel-core rules version's SHA-256 hashes, replayed by the upgrade test; no credentials"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^backend/tests/kernel/fixtures/kernel_core_version\.json$''']
regexTarget = "line"
regexes = ['''^\s*"draft_key_sha256": "[0-9a-f]{64}",?$''']
