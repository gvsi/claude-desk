<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // The theme chosen in this browser (src/lib/theme.ts), set before anything paints, with the page's scheme
      // narrowed to it so the blank page before the styles load is in its colors; the system's sets nothing.
      try {
        const theme = localStorage.getItem('claude-desk.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          const scheme = document.querySelector('meta[name="color-scheme"]');
          if (scheme) scheme.content = theme;
        }
      } catch {}
    </script>
    <title>Claude Desk</title>
    <link rel="icon" type="image/svg+xml" href="/src/ds/components/Mark/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=JetBrains+Mono:wght@400&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
