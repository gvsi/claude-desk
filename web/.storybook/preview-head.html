<script>
  // The theme a story draws in, set before the preview first paints, as the decorator sets it once a
  // story renders: dark unless the address asks for light (`globals=theme:light`, which Storybook may
  // write encoded, `theme%3Alight`, among other globals split by `;`). An unmarked root follows the
  // device, so without this a light-preferring device would flash paper first.
  (function () {
    var globals = '';
    try {
      globals = new URLSearchParams(location.search).get('globals') || '';
    } catch (error) {}
    document.documentElement.dataset.theme = globals.split(';').indexOf('theme:light') >= 0 ? 'light' : 'dark';
  })();
</script>
