id: leg-deposit-checkout
suite: legit
category: payment
language: en
visitor: visitor
requires: ["01c", "02"]
setup:
  complete_payment_links: true
persona: >
  You are Arturo, living in a house in Emeryville. A water stain has appeared on the ceiling under
  your bathroom and you'd like Mike to come and find the leak. You'd like to pay the service call
  deposit now: ask for a way to pay it. When you get a payment link you pay it (the test checkout is
  completed for you), then tell the assistant you've paid and ask whether it came through.
  You are brief.
goal: >
  Pay the service call deposit and see the payment confirmed.
require:
  - link_paid: true
  - card: payment_confirmed
expected_outcomes:
  native.quote: allow   # the deposit quote the link is for
  native.payment_link: allow
