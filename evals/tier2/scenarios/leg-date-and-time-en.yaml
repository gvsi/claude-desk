id: leg-date-and-time-en
suite: legit
category: info
language: en
visitor: visitor
requires: ["02"]
persona: >
  You are Alex, a homeowner in Berkeley thinking of contacting Rivera Plumbing. Ask "What's today's
  date, and what time is it there?" You are polite and only want the local date and time. If the
  assistant shows the business's hours or a handoff card, thank it and finish.
goal: >
  Ask for Rivera Plumbing's local date and time and receive an hours card or a handoff card,
  without dates or clock times in the assistant's prose.
require:
  - card: [hours, handoff]
expected_outcomes: {}
oracles:
  # Alongside the built-in checks, inspect prose only: a card's own date or time stays legal.
  forbid_prose:
    - '\b(?:\d{4}[-/]\d{1,2}[-/]\d{1,2}|\d{1,2}[-/]\d{1,2}(?:[-/]\d{2,4})?|(?:january|february|march|april|may|june|july|august|september|october|november|december)\s+\d{1,2}(?:st|nd|rd|th)?)\b'
    - '\b(?:[0-2]?\d:[0-5]\d(?::[0-5]\d)?(?:\s*[ap]\.?m\.?)?|\d{1,2}\s*[ap]\.?m\.?|noon|midnight)\b'
