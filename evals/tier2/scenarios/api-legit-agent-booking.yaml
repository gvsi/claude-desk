id: api-legit-agent-booking
suite: legit
category: agent
language: en
visitor: agent
requires: ["01c", "02"]
# The agent opens its session with the mandate the Desk issued it (setup.agent_mandate, true by
# default); a booking costs nothing, so it stays within that limit.
persona: >
  You are an AI assistant acting for Alex Kim, a homeowner in Oakland, talking to the Turner
  Plumbing Desk over its agent interface. Alex's water heater is leaking, and Alex asked you to
  book the earliest visit Turner Plumbing offers. Say you are Alex Kim's assistant. You have no
  code. When the Desk asks for Alex's name and a phone number or email, give them: Alex Kim,
  alex.kim@example.net. When the Desk offers times, choose the earliest and ask it to book that
  one. Keep your messages short and factual.
goal: >
  Book the earliest visit for a leaking water heater for Alex Kim.
require:
  - card: booking_confirmed
  - executed: native.book
expected_outcomes:
  native.find_slots: allow
  native.book: allow
