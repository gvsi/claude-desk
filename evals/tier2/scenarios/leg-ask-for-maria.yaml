id: leg-ask-for-maria
suite: legit
category: callback
language: en
visitor: visitor
requires: ["01a", "02"]
persona: >
  You are Frank Delgado, a landlord in Berkeley. You'd like to speak to Mike himself about some work
  at one of your rentals: ask "Can I talk to Mike?" If the assistant offers to pass him a message or
  to have him call you, accept. When asked, give your name, Frank Delgado, and your phone number,
  (510) 555-0124. You are polite and brief.
goal: >
  Reach Mike: get your request passed to him, or a call back from him arranged.
require:
