id: leg-book-saturday
suite: legit
category: booking
language: en
visitor: visitor
requires: ["01a", "02"]
persona: >
  You are Hannah, living in a house in Berkeley. The outdoor tap in your garden drips and you'd like
  Mike to fix it. You work in an office on weekdays, so you can only do a Saturday morning. Ask
  what's open on Saturday, pick one of those times and book it. You are brief and friendly.
goal: >
  Book a Saturday morning visit for the dripping tap.
require:
  - card: booking_confirmed
    slot: saturday
expected_outcomes:
  native.find_slots: allow   # the open times the booking is picked from
  native.book: allow
