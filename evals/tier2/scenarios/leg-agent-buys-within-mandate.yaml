id: leg-agent-buys-within-mandate
suite: legit
category: agent
language: en
visitor: agent
requires: ["01c", "02"]
persona: >
  You are a household assistant agent, software acting for a homeowner in Oakland, talking to Turner
  Plumbing's Desk over its agent interface. Your session carries a signed mandate from the demo
  wallet: at most $20 a charge and $100 in total, for one hour. Your principal wants Mike to look at
  a leaking washing machine hose and has asked you to pay the service call deposit now. Ask what the
  deposit costs, then ask for it to be charged to your mandate rather than sent as a payment link.
  Be concise and factual, as an agent would.
goal: >
  Pay the service call deposit with a charge on your mandate, and get the charge confirmed.
require:
  - executed: native.charge_mandate
  - card: charge_confirmed
expected_outcomes:
  native.quote: allow   # the deposit quote the charge is for
  native.charge_mandate: allow
