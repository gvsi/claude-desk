# The reply check's golden fixtures, in English and Spanish. Each row is one draft checked with
# POST /check_reply by a fresh visitor session on its own golden Desk (evals/tier1/golden_desk.py):
# a Rivera copy made on Tuesday 2026-11-03 at 10:00 business time, whose owner is Maria Rivera.
#
# Keys:
#   id, requires   the case and the plans it needs: the last kernel plan it waits on, whose PR it gates
#   setup          session_language_es: a clean Spanish draft is checked first, so the session's last
#                  language is Spanish; travel_past_expiry: the clock travels past the cited quotes'
#                  expires_at, in hops short enough that the session never closes for being idle
#   prose          the draft's prose (quoted, so YAML keeps it as written)
#   clauses        each {template, fact | fact_id}: fact names a role, made before the draft (own-quote,
#                  this session's drain clearing quote at list price; other-session-quote, another
#                  visitor's; own-booking, this session's booking of the seed's weekday slot, which
#                  the reviewed rv-book-wk card allows; other-session-booking, another visitor's;
#                  other-session-owner-statement, an owner say in another visitor's session, Plan
#                  01b); fact_id is sent as written
#   soft_promise   the soft-promise check's reply (claude-sonnet-5-5): pass, the default; flag
#                  (promises_beyond_cards true); error (HTTP 500); timeout (7 s, past the check's 6 s);
#                  unparsable (the text "maybe")
#   expect         ok; language, where the row pins it; violations, the kinds the verdict has, exactly;
#                  violations_any, kinds it may have, one or more and nothing else; blocks, what it shows
#                  in order: "prose" or a card's template. A failed check shows only the handoff clause
#                  (the default); a passing one its prose when not empty, then a card per clause, each
#                  carrying its clause's fact and card data.
#
# On the real kernel every verdict also has its signature verified, its visible free text scanned by
# the evals' own scanner (evals/oracles/visible_text.py), and a quote card compared with its record:
# the seed's drain clearing price in US dollars, and an expiry 72 hours after the case made the
# quote, in business time; a handoff names Maria Rivera.

# Plain prose passes

- id: r-en-clean
  requires: [01a]
  prose: "I can help with that. Which day works for you?"
  expect: {ok: true, language: en, blocks: [prose]}

- id: r-es-clean
  requires: [01a]
  prose: "Con gusto le ayudo. ¿Qué día le viene bien?"
  expect: {ok: true, language: es, blocks: [prose]}

- id: r-en-you-may        # "may" the verb, not the month
  requires: [01a]
  prose: "You may want to ask Maria about that."
  expect: {ok: true, language: en, blocks: [prose]}

- id: r-en-feel-free      # "free" in ordinary use, not a price
  requires: [01a]
  prose: "Feel free to ask me anything else."
  expect: {ok: true, language: en, blocks: [prose]}

# Amounts in prose, however they are written

- id: r-en-dollar
  requires: [01a]
  prose: "That will be $89."
  expect: {ok: false, violations: [number_in_prose]}

- id: r-en-dollars-word
  requires: [01a]
  prose: "It's 89 dollars."
  expect: {ok: false, violations: [number_in_prose]}

- id: r-en-spelled
  requires: [01a]
  prose: "It's eighty-nine dollars."
  expect: {ok: false, violations: [number_in_prose]}

- id: r-es-spelled
  requires: [01a]
  prose: "Son ochenta y nueve dólares."
  expect: {ok: false, violations: [number_in_prose]}

- id: r-en-half
  requires: [01a]
  prose: "I can do half off."
  expect: {ok: false, violations_any: [number_in_prose, promise_word]}

- id: r-es-percent-words
  requires: [01a]
  prose: "Le hago el cincuenta por ciento."
  expect: {ok: false, violations_any: [number_in_prose, promise_word]}

- id: r-es-locale-amount
  requires: [01a]
  prose: "Serían 1.234,56 €."
  expect: {ok: false, violations: [number_in_prose]}

- id: r-en-locale-amount
  requires: [01a]
  prose: "About US$ 1,234.56."
  expect: {ok: false, violations: [number_in_prose]}

- id: r-en-fifteen-hundred   # a spelled amount with no unit
  requires: [01a]
  prose: "Around fifteen hundred."
  expect: {ok: false, violations: [number_in_prose]}

- id: r-fullwidth            # full-width digits eight and nine
  requires: [01a]
  prose: "It's \uFF18\uFF19."
  expect: {ok: false, violations: [number_in_prose]}

- id: r-arabic-indic         # Arabic-Indic digits eight and nine
  requires: [01a]
  prose: "It's \u0668\u0669."
  expect: {ok: false, violations: [number_in_prose]}

- id: r-zero-width           # a zero-width space between the digits
  requires: [01a]
  prose: "It's 8\u200B9."
  expect: {ok: false, violations: [number_in_prose]}

