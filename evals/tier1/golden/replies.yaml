  requires: [01a]
  prose: "Claro, son ninety."
  expect: {ok: false, violations: [number_in_prose]}

- id: r-fr
  requires: [01a]
  prose: "Je peux vous aider avec ça."
  expect: {ok: false, violations: [unsupported_language]}

# The soft-promise check: a flag, or any failure of the check, blocks

- id: r-soft-promise-flag
  requires: [01a]
  prose: "I'm sure Maria will sort it out for you."
  soft_promise: flag
  expect: {ok: false, violations: [soft_promise]}

- id: r-soft-promise-error
  requires: [01a]
  prose: "I'm sure Maria will sort it out for you."
  soft_promise: error
  expect: {ok: false, violations: [soft_promise]}

- id: r-soft-promise-timeout
  requires: [01a]
  prose: "I'm sure Maria will sort it out for you."
  soft_promise: timeout
  expect: {ok: false, violations: [soft_promise]}

- id: r-soft-promise-unparsable
  requires: [01a]
  prose: "I'm sure Maria will sort it out for you."
  soft_promise: unparsable
  expect: {ok: false, violations: [soft_promise]}

# A reply that denies being an AI: the check's `denies_being_ai` flag is a soft_promise violation
# (rule_id soft.denies_ai), the kernel's only fixed, model-free handling of an AI denial.

- id: r-soft-promise-denies-ai
  requires: [01a]
  prose: "I'm a real person here, not a bot."
  soft_promise: denies_ai
  expect: {ok: false, violations: [soft_promise]}

- id: r-soft-promise-denies-ai-es
  requires: [01a]
  prose: "Soy una persona de verdad."
  soft_promise: denies_ai
  expect: {ok: false, violations: [soft_promise]}

# Cards from facts

- id: c-own-quote
  requires: [01a]
  prose: "Here is your quote."
  clauses: [{template: quote, fact: own-quote}]
  expect: {ok: true, language: en, blocks: [prose, quote]}

- id: c-own-quote-es
  requires: [01a]
  prose: "Aquí tiene su cotización."
  clauses: [{template: quote, fact: own-quote}]
  expect: {ok: true, language: es, blocks: [prose, quote]}

- id: c-empty-prose-falls-back   # no prose to detect: the session's last language
  requires: [01a]
  setup: session_language_es
  prose: ""
  clauses: [{template: quote, fact: own-quote}]
  expect: {ok: true, language: es, blocks: [quote]}

- id: c-unknown-fact
  requires: [01a]
  prose: "Here is your quote."
  clauses: [{template: quote, fact_id: "quote:does-not-exist"}]
  expect: {ok: false, violations: [unknown_fact]}

- id: c-other-session-quote
  requires: [01a]
  prose: "Here is your quote."
  clauses: [{template: quote, fact: other-session-quote}]
  expect: {ok: false, violations: [unentitled_fact]}

- id: c-expired-quote
  requires: [01a]
  setup: travel_past_expiry
  prose: "Here is your quote."
  clauses: [{template: quote, fact: own-quote}]
  expect: {ok: false, violations: [stale_fact]}

- id: c-hours                # a public charter fact
  requires: [01a]
  prose: "Here are our hours."
  clauses: [{template: hours, fact_id: "charter:hours"}]
  expect: {ok: true, blocks: [prose, hours]}

- id: c-contact              # a public charter fact
  requires: [01a]
  prose: "Here is how to reach us."
  clauses: [{template: contact, fact_id: "charter:contact"}]
  expect: {ok: true, blocks: [prose, contact]}

# Facts Claude may not cite. Only the kernel issues owner_said and payment_confirmed, so a drafted
# one is unknown_fact before its fact is read ("Clauses"): even an owner statement that exists, made
# in another session and readable there and by the owner alone, is refused as unknown_fact.

- id: c-owner-only-fact
  requires: [01b]
  prose: "Here is what Maria said."
  clauses: [{template: owner_said, fact: other-session-owner-statement}]
  expect: {ok: false, violations: [unknown_fact]}

- id: c-drafted-owner-said
  requires: [01a]
  prose: "Here is what Maria said."
  clauses: [{template: owner_said, fact: own-quote}]
  expect: {ok: false, violations: [unknown_fact]}

- id: c-drafted-payment-confirmed
  requires: [01a]
  prose: "Here is your receipt."
  clauses: [{template: payment_confirmed, fact: own-quote}]
  expect: {ok: false, violations: [unknown_fact]}

- id: c-template-mismatch    # a quote fact under the hours template
  requires: [01a]
  prose: "Here are our hours."
  clauses: [{template: hours, fact: own-quote}]
  expect: {ok: false, violations: [unknown_fact]}

# The owner's decision of 2026-10-30 on restating a card, at the boundaries it moved: a booking
# claim is shown beside this session's booking card and blocked with none (the booking lines are
# promise_word); beside another session's booking the card checks refuse the card, so the claim
# is blocked with it; and the bare "right away" is no time word.

- id: c-booking-claim-beside-its-card
  requires: [01a]
  prose: "You're booked."
  clauses: [{template: booking_confirmed, fact: own-booking}]
  expect: {ok: true, language: en, blocks: [prose, booking_confirmed]}

- id: r-booking-claim-without-a-card
  requires: [01a]
  prose: "You're booked."
  expect: {ok: false, violations: [promise_word]}

- id: c-booking-claim-beside-its-card-es
  requires: [01a]
  prose: "Tu cita está confirmada."
  clauses: [{template: booking_confirmed, fact: own-booking}]
  expect: {ok: true, language: es, blocks: [prose, booking_confirmed]}

- id: r-booking-claim-without-a-card-es
  requires: [01a]
  prose: "Tu cita está confirmada."
  expect: {ok: false, violations: [promise_word]}

- id: c-booking-claim-beside-another-sessions-card
  requires: [01a]
  prose: "You're booked."
  clauses: [{template: booking_confirmed, fact: other-session-booking}]
  expect: {ok: false, violations: [promise_word, unentitled_fact]}

- id: r-en-right-away
  requires: [01a]
  prose: "Turn off the water main right away."
  expect: {ok: true, language: en, blocks: [prose]}
