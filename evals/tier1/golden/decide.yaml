# The golden /decide table. Each row is one case on its own golden Desk (evals/tier1/golden_desk.py):
# a fresh Turner copy made on Tuesday 2026-11-03 at 10:00 business time (America/Los_Angeles).
#
# Keys:
#   id, requires   the case and the plans it needs: the last kernel plan it waits on, whose PR it gates
#   cards | seed   cards the owner drafts and confirms as the whole rule set (the compiler adds its
#                  default asks), or the seed's active cards: `active`, or `answering-off`, which also
#                  turns the Desk's Answering switch off (rv-quote allows no discount)
#   caller         visitor (unverified; the default); dana or bob, verified through their own Demo
#                  inbox entries; agent, with POST /agents/demo's key and mandate; agent-no-mandate,
#                  the key alone
#   call           the tool and what its args point at: item (with requested_discount_bp), slot (a
#                  role: wk, sat, tue-0800, tue-1659, tue-1700, sun22), document, quote (an item the
#                  caller first gets a list-price quote for, under the seed's cards), charge; args only
#                  for a tool no adapter has
#   raw_args       written over the built args as given, for args no builder would make
#   reviewer       the reviewer's one reply, so the case makes exactly one reviewer call: pass (scores
#                  10000 and 0, allow), refusal, {json: fields written over pass, types as given},
#                  {sleep: seconds} (then pass), {http_error: status}, {text: ...}; {if_called: pass}
#                  answers any number of calls. Without a reviewer, any reviewer call fails the case.
#   expect         dotted paths into the Decision, matched as harness.Expect does (state follows the
#                  outcome); on the real kernel also reviewer_calls, strikes (the caller's session)
#                  and default_ask (a tool the confirmed version holds a default ask card for)
#
# Cards are for anyone unless stated. Money is in cents and discounts in basis points. P, the seed's
# drain clearing price, is 18000: <P is 17999 and 2P is 36000. Custom items cost what they're named
# (v80 is 8000) and custom slots are on the calendar only in rows that use them.

# Overlap and coverage

- id: change-auto-book-ask
  requires: [01a]
  cards:
    - {card_id: g-auto-change, mode: auto, applies_to: "effect:change"}
    - {card_id: g-ask-book, mode: ask, applies_to: native.book}
  call: {tool: native.book, slot: wk}
  expect: {outcome: hold, card_ids: {$has: g-ask-book}, answers: {$has: deny_always}}

- id: change-auto-quote
  requires: [01a]
  cards:
    - {card_id: g-auto-change, mode: auto, applies_to: "effect:change"}
    - {card_id: g-ask-book, mode: ask, applies_to: native.book}
  call: {tool: native.quote, item: drain}
  expect: {outcome: allow}

- id: never-beats-auto
  requires: [01a]
  cards:
    - {card_id: g-never-book, mode: never, applies_to: native.book}
    - {card_id: g-auto-change, mode: auto, applies_to: "effect:change"}
  call: {tool: native.book, slot: wk}
  expect: {outcome: refuse, action: {$not: null}}   # refused by the rule, not before it

- id: tie-auto-ask
  requires: [01a]
  cards:
    - {card_id: g-auto-book, mode: auto, applies_to: native.book}
    - {card_id: g-ask-book, mode: ask, applies_to: native.book}
  call: {tool: native.book, slot: wk}
  expect: {outcome: hold, answers: {$has: deny_always}}

- id: autos-add-up
  requires: [01a]
  cards:
    - {card_id: g-auto-quote-below, mode: auto, applies_to: native.quote, max_amount_cents: 17999}   # <P
    - {card_id: g-auto-quote-at, mode: auto, applies_to: native.quote, max_amount_cents: 18000}      # P
  call: {tool: native.quote, item: drain}
  expect: {outcome: allow}

- id: specific-auto-over
