  call: {tool: native.release_document, document: dana-invoice}
  expect: {outcome: refuse, action: null}   # an unverified visitor isn't given the tool

- id: s-discount-float
  requires: [01a]
  seed: active
  call: {tool: native.quote, item: drain}
  raw_args: {requested_discount_bp: 1000.0}
  expect: {outcome: refuse, action: null}   # strict args: never coerced into a hold

- id: s-discount-string
  requires: [01a]
  seed: active
  call: {tool: native.quote, item: drain}
  raw_args: {requested_discount_bp: "1000"}
  expect: {outcome: refuse, action: null}

- id: s-answering-off
  requires: [01b]
  seed: answering-off
  call: {tool: native.quote, item: drain}
  expect: {outcome: refuse, action: null}   # with Answering off, a visitor is given lead capture and callbacks only

