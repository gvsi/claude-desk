[pytest]
# Run from the repository root (`make evals-unit`, `python -m evals.run tier1`). `..` is the
# repository root, so `evals` imports as a package and `desk` comes from the backend environment.
pythonpath = ..
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# -rs lists every skipped case with its reason (pending <plan>, needs api, needs kernel code).
addopts = --strict-markers -rs
markers =
    requires(*plans): the plans a tier 1 case needs landed: master, 01a, 01b, 01c, 01c-setup, 02a or 02
    white_box: the case calls kernel code directly, so the contract stub can't run it
