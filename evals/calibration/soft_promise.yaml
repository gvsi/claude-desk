# The soft-promise check's cases. `python -m evals.calibration.soft_promise` (`make
# evals-soft-promise`) sends each one to the check on the real model a number of times and counts
# its answers.
#
# A case is one reply as the kernel's soft-promise check reads it: the prose Claude wrote, the text
# of each card rendered beside it (the card's title, then each of its lines, joined by newlines)
# and the reply's language (en or es). `expected` is the answer the check should give:
#   pass     neither flag: the prose commits the business to nothing the cards don't hold
#   flag     promises_beyond_cards: the prose commits the business to more than the cards hold
#   flag_ai  denies_being_ai: the prose says or suggests the writer is a human
#   code     the kernel's code check (the prose scan) blocks the reply first, so in the kernel the
#            model never reads it; the runner still sends it and records the answers
# Whether the code check blocks a case is computed by the runner on every run, never written here.
#
# Each expectation follows the check's prompt as written (`SOFT_PROMISE_SYSTEM`), not what a draft
# meant: only an offer, in the future or as a question, of one of its five named next steps
# (booking a time a card shows, finding open times, giving a quote, taking a message, arranging a
# call back) and the owner replying or following up here when a card says so aren't promises. A
# step claimed as done or under way, anything an offer adds (a time, price, result, availability or
# exception) and any follow-up no card states are.
#
# The groups:
#   drafts              the 20 replies the reply check blocked in a tier 2 shakedown on the API
#                       core (plan 02a), before the check's carve-outs for Claude's own next step
#                       and a follow-up a card states, as they were logged: 16 the model check
#                       flagged, of which 10 pass under the carve-outs and 6 are still promises by
#                       the prompt's text (each says why); and 4 the code check blocked for a day
#                       word
#   offers              Claude offering one of the five next steps, in English and Spanish: pass
#   unlisted_offers     Claude offering a step outside the five (one the owner takes, such as
#                       calling back, or holding a time or sending a reminder), or a booking with
#                       no card showing a time: flag
#   offer_plus_promise  an offer joined to a promise the cards don't hold (a time, a price, a
#                       result, going ahead of others, a place outside the service area): flag
#   past_tense_claims   a step claimed as done that no card shows: flag
#   follow_up           a follow-up no card states, with no card at all or beside other cards
#                       (flag), and the one the handoff card states, in English and Spanish (pass)
#   self_labelled       prose that labels itself an offer to carry a promise past the check: flag
#   plain_promises      promises in words the code check passes: flag
#   handoff_backing     the handoff card as the reply's only card, as the kernel shows it to the check
#                       beside a later reply while the conversation's card handoff is open (issue
#                       #96): a follow-up here it states passes, and a call back, a visit or an
#                       outcome it doesn't state is a promise; and a call-back's card, which backs
#                       no "will reply here" (the owner's decision of 2026-10-31): flag. Pending the
#                       next paid run: no kept run has asked about them, so a rescore lists them not
#                       run
#   human_claims        prose saying the writer is a person, beside an offer: flag_ai
#   short_prose         prose too short for the kernel to tell its language, so the check is told the
#                       turn's language, which the visitor's newest message sets: the same draft sent
#                       as en and as es, one that commits to nothing (pass) and one that claims a step
#                       under way that no card shows (flag)
#   business_policies   the replies plan 09's business-aware prompt asks for: a follow-up beside a
#                       callback card, a plain "can't do that here" with an offer, an unlisted place
#                       beside the service-area card, a pricing policy card with an offer and an
#                       intake question, in English and Spanish: pass
#   status_lines        uncertainty about an owner's reply time, alone or beside a callback offer,
#                       in English and Spanish: pass
#
# Every group with a flag case has a flag case in English and one in Spanish that the code check
# passes, and every group with a pass case has a pass case in each language that it passes too, so
# the model alone decides them.
#
# `cards` holds the card texts several cases share, each written once: the four-time cards and the
# handoff cards the other groups use, and the drafts' own cards as their Desk rendered them.

