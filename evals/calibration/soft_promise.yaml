    prose: |-
      That sounds scary. Here's what to do right now:

      • Stay safe first. If water is near outlets, appliances or the electrical panel, don't walk through it. Turn off power to the basement only if you can reach the panel while standing somewhere dry.
      • Find the main shutoff valve. It's usually where the water line comes into the house, often low on the basement wall that faces the street, near the water meter. Turn the handle clockwise until it stops. If it's a lever, turn it so it sits across the pipe.
      • If you can't find it, the meter box out by the street usually has a shutoff too. You may need a meter key or a wrench.
      • Once the water is off, open a faucet on the lowest floor to drain the pipes. Move valuables out of the way and start soaking up water.

      Please call Rivera Plumbing right away at the number below. I've also let Maria Rivera know so she can follow up with you here.
