    language: en
    prose: Thank you, that helps. Water sitting in the cabinet is worth worrying about, so you're right to push on
      this. I can't see the plumber's schedule from here, but I can ask the owner to call you back about it. What
      name should I put on the callback? For now, it helps to clear out the cabinet, put a bowl or bucket under the
