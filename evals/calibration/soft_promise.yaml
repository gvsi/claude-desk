  # request_receipts: the session's request receipts, which the kernel shows the check after the
  # reply's cards though the reply doesn't show them again, each as "Request receipt card: ", what
  # was asked for, in the reply's language, and a decision's status line: a held request awaiting
  # the owner, or one resolved
  # since Claude's last reply that passed (a booking closed it, the owner declined it, it timed out).
  # Each case's cards carry their labels as the kernel sends them. A receipt backs what it says (the
  # quote request waits for Mike Turner; it was closed, declined or timed out) and nothing more: an
  # outcome, a time, an approval or a follow-up it doesn't state is a promise, as is a step under
  # way or another request. Measured on 2026-11-02; the results and the cases still missed are in
  # the header.
  - id: receipts-with-owner
    next_steps: *rivera_visitor_steps
    group: request_receipts
    language: en
    prose: "Your request is with Mike Turner now. Please check the request status in this chat."
    cards:
      - *receipt_held_en
    expected: pass
  - id: receipts-es-with-owner
    next_steps: *rivera_visitor_steps
    group: request_receipts
    language: es
    prose: "Su solicitud está con Mike Turner. Consulte el estado de la solicitud en este chat."
    cards:
      - *receipt_held_es
    expected: pass
  - id: receipts-passed-on
