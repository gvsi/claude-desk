      - *phone
      - *handoff_en
    # "I've also let Maria Rivera know" claims a step as done, and the prompt says "A claim that such a step already happened ... is still a promise"
    # since issue #96 the handoff card beside it opens the owner's handoff and alerts her when the reply is shown, so the claim is now true in practice; it stays flag (decision of 2026-10-31): the prompt is unchanged, and the card states that Maria will reply here, not that she was told
