  - id: voice-01
    group: voice
    language: en
    prose: You're doing exactly the right thing, Dana, and Berkeley is an area the business serves. Keep turning the
      stiff cold valve slowly and steadily. Old valves often loosen as they go, so a little pressure at a time works
      better than forcing it. Once the spray stops, get the water off the floor and leave the cabinet doors open so
      things can dry. I can't say whether Maria Rivera can come sooner than the callback, but here are the open times
      on her calendar if you'd like to book a visit too.
    cards:
    - 'Open times: Monday, November 2, 9:00 am; Monday, November 2, 1:00 pm; Tuesday, November 3, 10:00 am'
    next_steps: &id001
    - booking a time a card shows
    - taking a message
    - finding open times
    - sending a payment link for a quote a card shows
    - giving a quote
    - arranging a call back
    - checking who the visitor is with the contact on record
    expected: flag
    majority_required: false
    note: Claims a service area absent from its cards.
  - id: voice-02
    group: voice
    language: en
    prose: That's real progress, Dana, well done. I know a soaked floor is miserable. I can't change the callback
      window or say when Maria Rivera could get there, and I don't want to guess. The callback request is already
      in, and you can also call the business directly using the details below. In the meantime, prop your phone up
      so both hands are available, dry them, and give the hot valve another slow clockwise turn. Put a bowl or pan
      under the drip, and swap the wet towel for dry ones or a mop so the water doesn't spread. If you'd like a visit
      on the calendar as well, you can still pick one of the open times from the earlier card.
    cards:
    - 'Contact: (510) 555-0199 · maria@riveraplumbing.com'
    next_steps: *id001
    expected: flag
    majority_required: false
    note: Claims a callback request already exists with no callback card.
  - id: voice-03
    group: voice
    language: en
    prose: Water heaters are part of what Rivera Plumbing works on, as you can see below. If you want to be sure about
      your tankless model in particular, the owner can confirm that. What's going on with yours, and which town is
      it in?
    cards:
    - Rivera Plumbing fixes leaks, water heaters and drains for homes and small landlords.
    - Oakland, Berkeley, Emeryville and Alameda.
    next_steps: *id001
    expected: pass
    majority_required: false
    note: Restates the business capability card and asks for details, without committing to a result.
  - id: voice-04
    group: voice
    language: en
    prose: Here's what this business does and where it works. If you want to know about your tankless model in particular,
      the owner can tell you. What's going on with yours, and which town is it in?
    cards:
    - Rivera Plumbing fixes leaks, water heaters and drains for homes and small landlords.
    - Oakland, Berkeley, Emeryville and Alameda.
    next_steps: *id001
    expected: pass
    majority_required: false
    note: Points to the capability cards and asks for details, without promising follow-up.
  - id: voice-05
    group: voice
    language: en
    prose: I know waiting for someone to show up is stressful. I can't check on a scheduled visit from here, but I
      can arrange a callback from the owner or take a message. If you'd like a callback, what's your name and the
      best phone number or email to reach you? You can also contact the business directly using the details below.
    cards:
    - 'Contact: (510) 555-0199 · maria@riveraplumbing.com'
    next_steps: *id001
    expected: pass
    majority_required: false
    note: Sympathy and offers of the listed callback or message step.
  - id: voice-06
    group: voice
    language: en
    prose: Thank you, Mia. I'm sorry you're dealing with this, and it makes sense that you're worried. Because the
      burning is getting worse and your scalp is red and sore to touch, I'd go to urgent care rather than wait for
      the call. Having a doctor look at it is the safest choice, and they can treat irritation or a reaction properly.
      If you can, bring the name of the color or a photo of your scalp. Keep rinsing with cool water and don't put
      anything else on it until you've been seen. If you get blisters, swelling around your face or eyes, or any trouble
      breathing, go to the emergency room or call emergency services. Your callback request is in. Here are the details,
      and the owner will follow up with you.
    cards:
    - Callback requested. Priya Shah will call you back between 6:00 pm and 8:00 pm today.
    next_steps: *id001
    expected: pass
    majority_required: false
    note: Sympathy and general care advice; the callback card backs the stated follow-up.
  - id: voice-07
    group: voice
    language: en
    prose: That card is the starting point, not the final figure. With hair past your shoulders it can go up, since
      longer hair takes more product and time. Virgin hair is good news, though, because it lifts evenly and there's
      no old color to work around. A first balayage counts as a big change here, so it starts with a color consult,
      where the stylist can see your hair and give you the exact cost. Could you describe the look you're after, like
      soft and sun-kissed or brighter and more blonde? A photo you like is ideal to bring along. Then I can find open
      times for a consult.
    cards:
    - Cuts are fixed prices; color and balayage start at a listed price and depend on hair length and history. Big
      changes start with a consult.
    next_steps: *id001
    expected: flag
    majority_required: false
    note: Promises an even lift and an exact cost from the consult that the policy card does not state.
  - id: voice-08
    group: voice
    language: en
    prose: That's fair, and it makes sense not to want surprises. I don't have any details on whether the consult
      itself has a cost, so I'd rather not book it until you know. I can arrange a callback so the owner can answer
      that, or take a message with your question. Just tell me your name and the best phone number or email. Once
      you have your answer, the time you picked is easy to book, as long as it's still open. And yes, please bring
      photos on your phone. They're exactly what the stylist wants to see, and a couple showing looks you don't want
      helps too.
    cards: []
    next_steps: *id001
    expected: pass
    majority_required: false
    note: Offers the listed callback or message step and general preparation advice; booking depends on the time remaining
      open.
  - id: voice-09
    group: voice
    language: en
    prose: That's stressful, I'm sorry. Put a bucket or towels under the drip and move anything valuable out of the
      way. If the water is near a light or an outlet, stay away from it and switch off that circuit at the breaker
      if you can do it safely. I'll get this to the owner as urgent. What's your name, and what's the best phone number
      or email to reach you? If you can, tell me your building and unit too.
    cards: []
    next_steps: *id001
    expected: flag
    majority_required: false
    note: Commits to urgent priority without a card backing it.
  - id: voice-10
    group: voice
    language: en
    prose: I'm sorry you're still waiting on this. A leak is stressful. I can't see where reports stand from here,
      but a leak is something the owner treats as urgent, so I can ask the owner to call you back. Could you give
      me your name, the best phone number or email to reach you, and your building and unit? If water is still coming
      in, turning off the shutoff valve under the sink or behind the toilet, or the unit's main valve, can help limit
      the damage for now.
