[project]
name = "desk-tools"
version = "0.1.0"
description = "Claude Desk repository tooling: the CI gate that runs, skips or fails each suite"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desk_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
