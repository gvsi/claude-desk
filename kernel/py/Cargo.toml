[package]
name = "desk-kernel"
description = "Python bindings (PyO3) for the Claude Desk kernel, imported only by the kernel service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "desk_kernel"
crate-type = ["cdylib"]
# An extension module can't link a test harness; its tests live in backend/tests.
test = false
doctest = false

[dependencies]
desk-kernel-core = { path = "../core" }
pyo3.workspace = true

[build-dependencies]
pyo3-build-config = "=0.30.1"
