[project]
name = "desk"
version = "0.1.0"
description = "Claude Desk backend: the kernel service, the API service and their shared contracts"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9",
    "desk-kernel",
    "sqlalchemy[asyncio]==2.1.4",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "procrastinate==3.10.0",
]

# The kernel's Rust module, built from source by maturin; `make kernel` rebuilds it.
[tool.uv.sources]
desk-kernel = { path = "../kernel/py" }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
