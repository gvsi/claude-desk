[project]
name = "desk"
version = "0.1.0"
description = "Claude Desk backend: the kernel service, the API service and their shared contracts"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9",
    "desk-kernel",
    "sqlalchemy[asyncio]==2.1.4",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "procrastinate==3.10.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "sse-starlette>=3.6.0",
    "anthropic==2.3.0",
    "cryptography>=50.0.2",
    "mcp==2.3.0",
    "httpx2>=2.13.1",
]

# The kernel's Rust module, built from source by maturin; `make kernel` rebuilds it.
[tool.uv.sources]
desk-kernel = { path = "../kernel/py" }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]
# The evals (evals/): `uv run --project backend --group evals ...` from the repository root.
evals = [
    "anthropic==2.3.0",
    "cryptography==50.0.2",
    "faker==40.44.0",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "polyfactory==3.3.0",
    "pytest>=8",
    "pytest-asyncio==1.4.0",
    "pyyaml==6.0.3",
    "rfc8785==0.1.4",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "real_kernel: runs against a kernel process at DESK_KERNEL_URL instead of the fake",
    "live_model: calls a live model, the Claude API or Amazon Bedrock (MODEL_PROVIDER=bedrock); runs only with DESK_LIVE_MODEL=1 and the provider's credential",
    "kernel_plan(plan): the kernel plan that serves the route; skipped unless DESK_KERNEL_PLANS lists it",
    "solver: needs the cvc5 solver (CVC5 or PATH); skipped without it",
]
