[project]
name = "desk"
version = "0.1.0"
description = "Claude Desk backend: the kernel service, the API service and their shared contracts"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9",
    "desk-kernel",
]

# The kernel's Rust module, built from source by maturin; `make kernel` rebuilds it.
[tool.uv.sources]
desk-kernel = { path = "../kernel/py" }

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
